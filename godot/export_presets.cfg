[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/*.txt,assets/ui/branding/*.ico,assets/refined-world/catalog.json,LICENSE-ThirdParty-CC0.txt,LICENSE-Icons-CC-BY-3.0.txt"
exclude_filter="tests/*,addons/*,authoring/*,build/*,override.cfg,*.md,*.log"
export_path="build/windows/灰烬边境.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/ui/branding/logo.ico"
application/product_name="灰烬边境：星陨纪事"
application/file_description="灰烬边境：星陨纪事 · 原生电脑版"
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/*.txt,assets/refined-world/catalog.json,LICENSE-Game-CC0.txt,LICENSE-Godot.txt,LICENSE-ThirdParty-CC0.txt,LICENSE-Icons-CC-BY-3.0.txt"
exclude_filter="tests/*,addons/*,authoring/*,build/*,web/*,override.cfg,*.md,*.log"
export_path="../artifacts/godot/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
