<!doctype html>
<html lang="zh-CN" data-client="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172235">
  <title>灰烬边境：星陨纪事 · 电脑版</title>
  <link rel="icon" type="image/svg+xml" href="assets/expansion/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/expansion/icons/favicon-32.png">
  <link rel="stylesheet" href="assets/game.css?v=6.3"><link rel="stylesheet" href="assets/expansion.css?v=6.3">
  <link rel="stylesheet" href="assets/hud.css?v=6.3">
  <link rel="stylesheet" href="assets/character-portraits.css?v=7.1">
  <link rel="stylesheet" href="assets/loading.css?v=7.2">
  <link rel="stylesheet" href="assets/title-screen.css?v=7.1">
  <link rel="stylesheet" href="assets/rail-ui.css?v=7.2">
  <link rel="stylesheet" href="assets/art-v3.css?v=7.2">
  <link rel="stylesheet" href="assets/client.css?v=7.3">
  <link rel="preload" as="image" href="assets/art-v2/title.webp" fetchpriority="high">
</head>
<body>
  <main id="gameViewport" aria-label="灰烬边境游戏画面">
    <section id="gameLoading" tabindex="-1" aria-label="场景加载" aria-busy="true">
      <div class="loading-content">
        <div class="loading-kicker">灰烬边境 · 星陨纪事</div>
        <h1>循光赴远境</h1><p class="loading-destination">归灯尚明，远境将启</p>
        <div class="loading-track" role="progressbar" aria-label="地图加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <div class="loading-meta"><p class="loading-status" role="status" aria-live="polite">正在唤醒这片远境…</p><span class="loading-percent" aria-hidden="true">0%</span></div>
        <div class="loading-actions" hidden><button data-loading-retry>重新加载</button><button data-loading-fallback>暂用简化画面</button></div>
        <p class="loading-tip">灯火照亮来路，也指引下一段旅程。</p>
      </div>
    </section>
    <div id="worldStage" class="pixel-scene"><canvas id="pixelWorld" width="1920" height="1080" data-biome="town" tabindex="0" aria-label="边境等距场景"></canvas></div>
    <div id="hudLayer"></div>
    <div id="panelLayer"><div class="app"><section class="main"><button class="panel-close" data-screen="adventure" aria-label="关闭功能面板">×</button>
      <section class="screen active" id="screen-adventure"></section>
      <section class="screen" id="screen-inventory"></section>
      <section class="screen" id="screen-journal"></section>
      <section class="screen" id="screen-party"></section>
      <section class="screen" id="screen-crafting"></section>
      <section class="screen" id="screen-codex"></section>
      <section class="screen" id="screen-settings"></section>
      <section class="screen" id="screen-more"></section>
      <section class="screen" id="screen-title"></section>
    </section></div></div>
    <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true"><div class="modal" id="modalContent"></div></div>
    <div class="toast" id="toast"></div>
  </main>
  <script src="js/deployment-config.js?v=7.3" defer></script>
  <script src="js/game-bundle.js?v=7.3" defer></script>
</body>
</html>
